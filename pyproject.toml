[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "suno-hmnn-mcp"
version = "1.0.0"
description = "Local MCP tools for Suno music workflows and library records."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "George AK Neihsial" }
]
keywords = ["suno-ai", "mcp", "fastmcp", "ai-music", "hermes-agent", "cursor-ide", "claude-desktop"]
dependencies = [
    "httpx>=0.28.0",
    "mcp>=1.2.0,<2",
    "pydantic>=2.7.0",
    "aiofiles>=23.2.1",
    "platformdirs>=4.2.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0"
]

[project.urls]
Homepage = "https://github.com/SialkiLabs/Suno-Hmnn-MCP"
Repository = "https://github.com/SialkiLabs/Suno-Hmnn-MCP"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.scripts]
suno-hmnn-mcp = "server:mcp.run"
suno-hmnn-setup = "wizard:main"

[tool.setuptools]
py-modules = ["server", "wizard"]

[tool.setuptools.packages.find]
include = ["core", "core.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
